<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>喵提醒</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: visible; height: 100%; }
    body { font-family: "PingFang SC", -apple-system, sans-serif; }

    .container {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px;
      animation: slideDown .4s cubic-bezier(.34,1.56,.64,1);
      cursor: grab;
    }
    .container.dragging { cursor: grabbing; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cat-img {
      flex-shrink: 0; width: 56px; height: 56px;
      object-fit: contain; margin-top: 6px;
      animation: headTilt 2.5s ease-in-out infinite;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.15));
      pointer-events: none;
    }
    @keyframes headTilt {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-4deg) scale(1.03); }
      75% { transform: rotate(3deg) scale(1.03); }
    }

    .bubble {
      flex: 1; min-width: 0;
      background: #fff; border-radius: 12px;
      padding: 9px 30px 9px 12px;
      box-shadow: 0 3px 16px rgba(0,0,0,.12);
      position: relative;
      pointer-events: none;
    }

    .bubble-title {
      font-size: 10px; color: #999; margin-bottom: 2px;
      display: flex; align-items: center; gap: 3px;
    }
    .bubble-title .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #ff6b6b; animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }
    .bubble-title.overdue .dot { background: #e74c3c; }
    .bubble-title.overdue #title-text { color: #e74c3c; }

    .bubble-text {
      font-size: 12.5px; color: #333; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      word-break: break-word; font-weight: 500;
    }

    .close-btn {
      position: absolute; top: 5px; right: 7px;
      width: 18px; height: 18px; border: none; background: none;
      cursor: pointer; color: #ccc; font-size: 14px;
      line-height: 18px; text-align: center; border-radius: 50%;
      transition: all .15s;
      pointer-events: auto;
    }
    .close-btn:hover { background: #f0f0f0; color: #666; }

    .action-btns {
      display: flex; gap: 6px; margin-top: 6px;
      pointer-events: auto;
    }
    .action-btn {
      padding: 3px 8px; border-radius: 10px; border: none;
      font-size: 10px; font-family: inherit; cursor: pointer;
      transition: all .15s; color: #666; background: #f5f5f5;
    }
    .action-btn:hover { background: #e8e8e8; color: #333; }
    .action-btn.done-btn:hover { background: #e8f8e8; color: #28c840; }
    .action-btn.later-btn:hover { background: #fff8e8; color: #f5a623; }

    /* 稍后提醒 - 下拉选择器（类似优先级） */
    .later-wrap {
      position: relative;
    }
    .later-dropdown {
      display: none; position: absolute;
      top: calc(100% + 4px); left: 0;
      background: #fff; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
      padding: 4px; min-width: 70px;
      z-index: 100;
      animation: dropIn .12s ease;
    }
    .later-dropdown.show { display: flex; flex-direction: column; gap: 2px; }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .later-item {
      padding: 5px 10px; border-radius: 8px; border: none;
      font-size: 10px; font-family: inherit; cursor: pointer;
      color: #555; background: transparent; transition: all .1s;
      text-align: left; white-space: nowrap;
    }
    .later-item:hover { background: #fff8e8; color: #f5a623; }

    .fadeOut {
      animation: fadeOut .3s ease forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <img class="cat-img" id="cat-img" src="" alt="喵~" />
    <div class="bubble" id="bubble">
      <button class="close-btn" id="close-btn" title="关闭">×</button>
      <div class="bubble-title" id="bubble-title">
        <span class="dot"></span>
        <span id="title-text">该做这件事啦~</span>
      </div>
      <div class="bubble-text" id="bubble-text"></div>
      <div class="action-btns" id="action-btns">
        <button class="action-btn done-btn" id="btn-done">✓ 完成</button>
        <span class="later-wrap">
          <button class="action-btn later-btn" id="btn-later">⏰ 稍后提醒</button>
          <div class="later-dropdown" id="later-dropdown">
            <button class="later-item" data-min="10">10 分钟后</button>
            <button class="later-item" data-min="30">30 分钟后</button>
            <button class="later-item" data-min="60">1 小时后</button>
          </div>
        </span>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const path = require('path');

    // 随机选一只猫咪
    const catIndex = Math.floor(Math.random() * 6) + 1;
    const catPath = path.join(__dirname, 'assets', 'cats', `cat${catIndex}.png`);
    document.getElementById('cat-img').src = catPath;

    // 接收提醒内容
    ipcRenderer.on('show-reminder', (_, data) => {
      document.getElementById('bubble-text').textContent = data.text;
      if (data.isOverdue) {
        document.getElementById('title-text').textContent = '已经超时啦！快去做~';
        document.getElementById('bubble-title').classList.add('overdue');
      } else {
        document.getElementById('title-text').textContent = '该做这件事啦~';
      }
    });

    // 告诉主进程：我准备好了
    ipcRenderer.send('reminder-ready');

    // ===== 拖动 + 点击逻辑 =====
    let isDragging = false;
    let startX = 0, startY = 0;
    let totalMoved = 0;
    const CLICK_THRESHOLD = 5;

    const container = document.getElementById('container');

    container.addEventListener('mousedown', (e) => {
      if (e.target.id === 'close-btn') return;
      if (e.target.closest('.action-btns')) return;
      isDragging = true;
      startX = e.screenX;
      startY = e.screenY;
      totalMoved = 0;
      container.classList.add('dragging');
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      startX = e.screenX;
      startY = e.screenY;
      totalMoved += Math.abs(dx) + Math.abs(dy);
      ipcRenderer.send('reminder-drag', { dx, dy });
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      container.classList.remove('dragging');
      if (totalMoved < CLICK_THRESHOLD && e.target.id !== 'close-btn') {
        ipcRenderer.send('reminder-clicked');
      }
    });

    // 关闭按钮
    document.getElementById('close-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      container.classList.add('fadeOut');
      setTimeout(() => ipcRenderer.send('close-reminder'), 350);
    });

    // 完成按钮
    document.getElementById('btn-done').addEventListener('click', (e) => {
      e.stopPropagation();
      ipcRenderer.send('reminder-action', { action: 'done' });
      container.classList.add('fadeOut');
      setTimeout(() => ipcRenderer.send('close-reminder'), 350);
    });

    // 稍后提醒 - 点击展开下拉
    const dropdown = document.getElementById('later-dropdown');
    document.getElementById('btn-later').addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.toggle('show');
    });

    // 下拉选项点击
    document.querySelectorAll('.later-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const min = parseInt(btn.dataset.min);
        ipcRenderer.send('reminder-action', { action: 'delay', minutes: min });
        container.classList.add('fadeOut');
        setTimeout(() => ipcRenderer.send('close-reminder'), 350);
      });
    });

    // 点击其他地方关闭下拉
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.later-wrap')) {
        dropdown.classList.remove('show');
      }
    });
  </script>
</body>
</html>
